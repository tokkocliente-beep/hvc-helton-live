<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SMC BLACKBOX — Gráfico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg-0:#070a10;
    --bg-1:#0d121b;
    --bg-2:#111826;
    --border:#1c2430;
    --text-hi:#e8edf5;
    --text-lo:#7c8898;
    --up:#3ee6b8;
    --down:#ff5c72;
    --accent:#5b8cff;
    --gold:#ffb020;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 20% 0%, #0f1420 0%, var(--bg-0) 60%);
    color:var(--text-hi);
    font-family:'Space Grotesk', system-ui, sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @font-face{font-family:'Space Grotesk';src:local('Space Grotesk');}
  @font-face{font-family:'JetBrains Mono';src:local('JetBrains Mono');}

  /* ---- topbar ---- */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 14px;
    background:var(--bg-1);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  #brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:15px;
    letter-spacing:.3px;
    white-space:nowrap;
  }
  #brand .cube{
    width:20px;height:20px;
    background:linear-gradient(135deg,var(--accent),#8a5bff);
    border-radius:5px;
    box-shadow:0 0 12px rgba(91,140,255,.5);
    flex-shrink:0;
  }
  #brand small{
    display:block;
    font-weight:400;
    font-size:10px;
    color:var(--text-lo);
    letter-spacing:.4px;
  }

  #controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  select#assetSelect{
    background:var(--bg-2);
    color:var(--text-hi);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    outline:none;
  }

  #tfGroup{
    display:flex;
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }
  #tfGroup button{
    background:transparent;
    color:var(--text-lo);
    border:none;
    padding:7px 11px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    cursor:pointer;
    border-right:1px solid var(--border);
    transition:background .15s, color .15s;
  }
  #tfGroup button:last-child{border-right:none;}
  #tfGroup button:hover{color:var(--text-hi);}
  #tfGroup button.active{
    background:var(--accent);
    color:#08101f;
    font-weight:700;
  }

  #statusDot{
    width:8px;height:8px;border-radius:50%;
    background:var(--up);
    box-shadow:0 0 6px var(--up);
    animation:blink 1.6s infinite;
    flex-shrink:0;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---- price header ---- */
  #priceRow{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:8px 14px;
    background:var(--bg-1);
    border-bottom:1px solid var(--border);
  }
  #priceRow .pair{font-size:13px; color:var(--text-lo); font-family:'JetBrains Mono', monospace;}
  #priceRow .price{font-size:20px; font-weight:700; font-family:'JetBrains Mono', monospace;}
  #priceRow .delta{font-size:12px; font-family:'JetBrains Mono', monospace; padding:2px 6px; border-radius:5px;}
  .delta.pos{color:var(--up); background:rgba(62,230,184,.1);}
  .delta.neg{color:var(--down); background:rgba(255,92,114,.1);}

  /* ---- chart area ---- */
  #chartWrap{flex:1; position:relative; min-height:0;}
  #chart{position:absolute; inset:0;}

  #footer{
    padding:6px 14px;
    background:var(--bg-1);
    border-top:1px solid var(--border);
    font-size:10px;
    color:var(--text-lo);
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:.3px;
  }
</style>
</head>
<body>

  <div id="topbar">
    <div id="brand">
      <div class="cube"></div>
      <div>
        SMC BLACKBOX
        <small>ANÁLISE INSTITUCIONAL — HVC HELTON</small>
      </div>
    </div>
    <div id="controls">
      <span id="statusDot" title="Conexão ao vivo"></span>
      <select id="assetSelect">
        <option value="EURUSD">EUR/USD</option>
        <option value="EURUSD-OTC">EUR/USD OTC</option>
        <option value="EURJPY">EUR/JPY</option>
        <option value="EURJPY-OTC">EUR/JPY OTC</option>
        <option value="ETHUSD">Ethereum</option>
        <option value="ETHUSD-OTC">Ethereum OTC</option>
        <option value="BTCUSD">Bitcoin</option>
        <option value="BTCUSD-OTC">Bitcoin OTC</option>
      </select>
      <div id="tfGroup">
        <button data-tf="60" class="active">M1</button>
        <button data-tf="300">M5</button>
        <button data-tf="900">M15</button>
        <button data-tf="1800">M30</button>
      </div>
    </div>
  </div>

  <div id="priceRow">
    <span class="pair" id="pairLabel">EUR/USD</span>
    <span class="price" id="priceLabel">—</span>
    <span class="delta pos" id="deltaLabel">+0.00%</span>
  </div>

  <div id="chartWrap">
    <div id="chart"></div>
  </div>

  <div id="footer">Dados simulados para demonstração — plugar endpoint IQ Option em <code>fetchCandles()</code> · Não é recomendação de investimento</div>

<script>
/* =========================================================================
   SMC BLACKBOX — Gráfico HVC Helton
   Componente standalone com lightweight-charts.

   PARA CONECTAR NA API REAL DA IQ OPTION:
   - Troque a função generateMockCandles() por uma chamada ao seu backend
     Flask (ex: fetch('/api/candles?asset=EURUSD&tf=60')) que devolve o
     histórico de velas via iqoptionapi.
   - Troque o setInterval de simulação por polling real de 1s no endpoint
     de última vela (mesmo padrão descrito no projeto: polling de 1s,
     meta de 100 velas carregadas por timeframe).
   ========================================================================= */

const chartEl = document.getElementById('chart');

const chart = LightweightCharts.createChart(chartEl, {
  layout: {
    background: { color: 'transparent' },
    textColor: '#7c8898',
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 11,
  },
  grid: {
    vertLines: { color: 'rgba(28,36,48,0.6)' },
    horzLines: { color: 'rgba(28,36,48,0.6)' },
  },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  rightPriceScale: { borderColor: '#1c2430' },
  timeScale: { borderColor: '#1c2430', timeVisible: true, secondsVisible: false },
});

const candleSeries = chart.addCandlestickSeries({
  upColor: '#3ee6b8',
  downColor: '#ff5c72',
  borderUpColor: '#3ee6b8',
  borderDownColor: '#ff5c72',
  wickUpColor: '#3ee6b8',
  wickDownColor: '#ff5c72',
});

function resizeChart() {
  chart.resize(chartEl.clientWidth, chartEl.clientHeight);
}
window.addEventListener('resize', resizeChart);
resizeChart();

/* ---- estado ---- */
let currentAsset = 'EURUSD';
let currentTF = 60; // segundos
let candles = [];
let basePrice = 1.0850;

/* ---- dados simulados (trocar por chamada real à IQ Option) ---- */
function seedBasePrice(asset) {
  const bases = {
    EURUSD: 1.0850, 'EURUSD-OTC': 1.0850,
    EURJPY: 162.30, 'EURJPY-OTC': 162.30,
    ETHUSD: 3120.0, 'ETHUSD-OTC': 3120.0,
    BTCUSD: 61500.0, 'BTCUSD-OTC': 61500.0,
  };
  return bases[asset] ?? 1.0;
}

function generateMockCandles(asset, tf, count = 100) {
  const arr = [];
  let price = seedBasePrice(asset);
  const now = Math.floor(Date.now() / 1000);
  const start = now - count * tf;

  for (let i = 0; i < count; i++) {
    const time = start + i * tf;
    const vol = price * 0.0009;
    const open = price;
    const close = open + (Math.random() - 0.5) * vol * 2;
    const high = Math.max(open, close) + Math.random() * vol;
    const low = Math.min(open, close) - Math.random() * vol;
    arr.push({ time, open, high, low, close });
    price = close;
  }
  return arr;
}

function loadAsset(asset, tf) {
  candles = generateMockCandles(asset, tf, 100);
  candleSeries.setData(candles);
  chart.timeScale().fitContent();
  updatePriceRow();
}

function updatePriceRow() {
  if (!candles.length) return;
  const last = candles[candles.length - 1];
  const prev = candles.length > 1 ? candles[candles.length - 2] : last;
  const pct = ((last.close - prev.close) / prev.close) * 100;

  document.getElementById('pairLabel').textContent = formatLabel(currentAsset);
  document.getElementById('priceLabel').textContent = last.close.toFixed(currentAsset.startsWith('EURJPY') ? 3 : (currentAsset.includes('USD') && !currentAsset.startsWith('EUR') ? 2 : 5));

  const deltaEl = document.getElementById('deltaLabel');
  deltaEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
  deltaEl.className = 'delta ' + (pct >= 0 ? 'pos' : 'neg');
}

function formatLabel(asset) {
  const map = {
    EURUSD: 'EUR/USD', 'EURUSD-OTC': 'EUR/USD · OTC',
    EURJPY: 'EUR/JPY', 'EURJPY-OTC': 'EUR/JPY · OTC',
    ETHUSD: 'ETHEREUM', 'ETHUSD-OTC': 'ETHEREUM · OTC',
    BTCUSD: 'BITCOIN', 'BTCUSD-OTC': 'BITCOIN · OTC',
  };
  return map[asset] ?? asset;
}

/* ---- simulação de vela viva (polling de 1s) ---- */
setInterval(() => {
  if (!candles.length) return;
  const last = candles[candles.length - 1];
  const nowBucket = Math.floor(Date.now() / 1000 / currentTF) * currentTF;
  const vol = last.close * 0.0004;
  const newClose = last.close + (Math.random() - 0.5) * vol * 2;

  if (nowBucket === last.time) {
    last.high = Math.max(last.high, newClose);
    last.low = Math.min(last.low, newClose);
    last.close = newClose;
    candleSeries.update(last);
  } else {
    const newCandle = {
      time: nowBucket,
      open: last.close,
      close: newClose,
      high: Math.max(last.close, newClose),
      low: Math.min(last.close, newClose),
    };
    candles.push(newCandle);
    candleSeries.update(newCandle);
  }
  updatePriceRow();
}, 1000);

/* ---- eventos de UI ---- */
document.getElementById('assetSelect').addEventListener('change', (e) => {
  currentAsset = e.target.value;
  loadAsset(currentAsset, currentTF);
});

document.querySelectorAll('#tfGroup button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tfGroup button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentTF = parseInt(btn.dataset.tf, 10);
    loadAsset(currentAsset, currentTF);
  });
});

/* ---- inicialização ---- */
loadAsset(currentAsset, currentTF);
</script>
</body>
</html>
