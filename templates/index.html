<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SMC BLACKBOX</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { background:#070a10; color:#d1d4dc; font-family: 'JetBrains Mono', monospace; }
  #topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
            background:#0d121b; border-bottom:1px solid #1c2430; gap:10px; flex-wrap:wrap; }
  #pair-info { display:flex; align-items:center; gap:8px; }
  #pair-info .dot { width:8px; height:8px; border-radius:50%; background:#22d3ee; }
  #pair-select { background:#0d121b; color:#d1d4dc; border:1px solid #1c2430; border-radius:8px;
                 padding:6px 8px; font-family:inherit; font-size:12px; }
  #live-price { font-size:16px; font-weight:700; color:#fff; }
  #live-change { font-size:12px; }
  #live-change.up { color:#26a69a; }
  #live-change.down { color:#ef5350; }
  #logout-link { color:#9aa4b2; font-size:11px; text-decoration:none; border:1px solid #1c2430;
                 padding:6px 10px; border-radius:8px; }

  #tf-row { display:flex; gap:6px; padding:10px 12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:56px; padding:9px 4px; border-radius:8px; border:2px solid #1c2430;
         background:#0d121b; color:#d1d4dc; font-weight:700; font-size:13px; text-align:center;
         font-family:inherit; cursor:pointer; }
  .btn.active { background:#22d3ee; color:#000; border-color:#22d3ee; }

  #chart-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px;
                  font-size:11px; color:#9aa4b2; border-top:1px solid #1c2430; }
  #chart-wrap { position:relative; width:100%; height:460px; border-bottom:1px solid #1c2430; }
  #chart-container { width:100%; height:100%; }
  #chart-status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                  background:rgba(7,10,16,0.85); color:#9aa4b2; font-size:13px; z-index:5; }
  #chart-status.hidden { display:none; }

  #rodape { padding:14px 12px; font-size:10px; color:#565f70; text-align:center; }
</style>
</head>
<body>

<div id="topbar">
  <div id="pair-info">
    <span class="dot"></span>
    <span id="pair-label">EUR/USD</span>
  </div>
  <select id="pair-select">
    <option value="EURUSD" selected>EUR/USD</option>
    <option value="EURUSD-OTC">EUR/USD OTC</option>
    <option value="EURJPY">EUR/JPY</option>
    <option value="EURJPY-OTC">EUR/JPY OTC</option>
    <option value="ETHUSD">Ethereum</option>
    <option value="ETHUSD-OTC">Ethereum OTC</option>
    <option value="BTCUSD">Bitcoin</option>
    <option value="BTCUSD-OTC">Bitcoin OTC</option>
  </select>
  <span id="live-price">--</span>
  <span id="live-change">--</span>
  <a id="logout-link" href="/logout">Sair</a>
</div>

<div id="tf-row">
  <button class="btn active" data-tf="1">M1</button>
  <button class="btn" data-tf="5">M5</button>
  <button class="btn" data-tf="15">M15</button>
  <button class="btn" data-tf="30">M30</button>
  <button class="btn" data-tf="60">H1</button>
</div>

<div id="chart-header">
  <span id="chart-pair-label">EURUSD</span>
  <span id="chart-candle-count">0 candles</span>
</div>

<div id="chart-wrap">
  <div id="chart-container"></div>
  <div id="chart-status">Carregando…</div>
</div>

<div id="rodape">SMC BLACKBOX · gráfico base — indicadores serão adicionados um de cada vez, depois de testados</div>

<script>
// =====================================================================
// SMC BLACKBOX — gráfico base, construído do zero.
// Sem nenhum indicador (Fibo/Elliott/SMC/ZigZag/etc) — só o gráfico de
// velas funcionando direito. Indicadores entram depois, um de cada vez.
// =====================================================================

var $ = function(id){ return document.getElementById(id); };

var SMC = {
  symbol: 'EURUSD',
  chartMinutes: 15,
  candles: [],        // buffer de velas de 1min, sempre em ordem crescente
  chartCandles: [],   // velas já agregadas pro TF atual (o que está no gráfico)
  chart: null,
  series: null,
};

var TARGET_CANDLES = 500; // meta de velas visíveis em qualquer TF
var BASE_1M_BUFFER_MAX = 32000; // ~530h — cabe 500 velas até no H1
var IQ_POLL_INTERVAL_MS = 3000;

var chartContainer = $('chart-container');
var chartStatus = $('chart-status');

// ---------------------------------------------------------------------
// Gráfico
// ---------------------------------------------------------------------
function initChart(){
  SMC.chart = LightweightCharts.createChart(chartContainer, {
    width: chartContainer.clientWidth,
    height: chartContainer.clientHeight,
    layout: { background: { color:'transparent' }, textColor:'#d1d4dc' },
    grid: { vertLines:{color:'#151b26'}, horzLines:{color:'#151b26'} },
    rightPriceScale: { borderColor:'#1c2430' },
    timeScale: { borderColor:'#1c2430', timeVisible:true, secondsVisible:false },
  });
  SMC.series = SMC.chart.addCandlestickSeries({
    upColor:'#26a69a', downColor:'#ef5350', borderVisible:false,
    wickUpColor:'#26a69a', wickDownColor:'#ef5350',
  });
  new ResizeObserver(function(){
    if (chartContainer.clientWidth) SMC.chart.applyOptions({ width: chartContainer.clientWidth });
  }).observe(chartContainer);
}

// densidade de vela em pixels — meta de 50 velas visíveis quando tem dado
// suficiente pra isso. Se tiver MENOS de 50 velas carregadas nesse TF
// (comum logo após abrir o app ou trocar de TF maior), usar sempre "50
// slots" deixa um vazio enorme de um lado, porque scrollToRealTime()
// ancora as poucas velas reais só na ponta. Nesse caso, preenche a
// largura toda com o intervalo de TEMPO real das velas que existem.
function setZoom(){
  if (!SMC.chart) return;
  try{
    var ts = SMC.chart.timeScale();
    var containerWidth = chartContainer.clientWidth || 700;
    var barSpacing = containerWidth / 50;
    var total = SMC.chartCandles.length;
    if (total > 0 && total < 50) {
      var periodSec = SMC.chartMinutes * 60;
      var firstTime = SMC.chartCandles[0].time;
      var lastTime = SMC.chartCandles[total - 1].time;
      ts.setVisibleRange({ from: firstTime, to: lastTime + Math.round(periodSec * 1.5) });
    } else {
      ts.applyOptions({ barSpacing: barSpacing, rightOffset: 6 });
      ts.scrollToRealTime();
    }
  }catch(e){ console.warn('zoom erro', e); }
}

// ---------------------------------------------------------------------
// Dados: normalização, sanitização, agregação
// ---------------------------------------------------------------------
function normCandle(v){
  return { time: v.time, open: v.open, high: v.high, low: v.low, close: v.close, volume: v.volume||0 };
}

// ordena, remove duplicata e timestamp inválido — a lib do gráfico se
// recusa a desenhar (fica tudo em branco, sem erro visível) se receber
// tempo fora de ordem ou repetido.
function sanitizarCandles(list){
  if (!list || !list.length) return [];
  var vistos = {};
  var limpo = [];
  for (var i=0;i<list.length;i++){
    var c = list[i];
    if (!c || typeof c.time !== 'number' || isNaN(c.time)) continue;
    if (vistos[c.time]) continue;
    vistos[c.time] = true;
    limpo.push(c);
  }
  limpo.sort(function(a,b){ return a.time - b.time; });
  return limpo;
}

function aggregateCandles(candles1m, minutes){
  if (minutes <= 1) return candles1m;
  var periodSec = minutes * 60;
  var out = [], bucket = null, bucketStart = null;
  for (var i=0;i<candles1m.length;i++){
    var c = candles1m[i];
    var start = c.time - (c.time % periodSec);
    if (bucketStart !== start) {
      if (bucket) out.push(bucket);
      bucketStart = start;
      bucket = { time: start, open: c.open, high: c.high, low: c.low, close: c.close, volume: c.volume||0 };
    } else {
      bucket.high = Math.max(bucket.high, c.high);
      bucket.low = Math.min(bucket.low, c.low);
      bucket.close = c.close;
      bucket.volume = (bucket.volume||0) + (c.volume||0);
    }
  }
  if (bucket) out.push(bucket);
  return out;
}

// ---------------------------------------------------------------------
// Rede: busca de histórico + polling ao vivo
// ---------------------------------------------------------------------
function fetchHistoryQtd(qtd){
  var url = '/candles?ativo=' + encodeURIComponent(SMC.symbol) + '&qtd=' + qtd;
  return fetch(url).then(function(res){
    if (!res.ok) throw new Error('http ' + res.status);
    return res.json();
  }).then(function(lista){
    return lista.map(normCandle);
  });
}

function fetchHistoryComFallback(){
  var qtdAlvo = TARGET_CANDLES * (SMC.chartMinutes || 15);
  return fetchHistoryQtd(qtdAlvo).then(function(list){
    if (list && list.length) return list;
    return fetchHistoryQtd(300);
  }).catch(function(){
    return fetchHistoryQtd(300);
  });
}

var pollTimer = null;
function pollIqOption(){
  fetchHistoryQtd(100).then(function(lista){
    if (!lista.length) return;
    var buf = SMC.candles.slice();
    var byTime = {};
    for (var i=0;i<buf.length;i++) byTime[buf[i].time] = true;
    var novas = false;
    for (var j=0;j<lista.length;j++){
      var c = lista[j];
      if (!byTime[c.time]) { buf.push(c); novas = true; }
      else {
        // vela do minuto atual, ainda "viva" — atualiza em vez de duplicar
        for (var k=buf.length-1;k>=0 && k>buf.length-5;k--){
          if (buf[k].time === c.time) { buf[k] = c; break; }
        }
      }
    }
    if (novas) {
      buf = sanitizarCandles(buf);
      if (buf.length > BASE_1M_BUFFER_MAX) buf.splice(0, buf.length - BASE_1M_BUFFER_MAX);
    }
    SMC.candles = sanitizarCandles(buf);
    redesenhar();
    if (lista.length) atualizarPrecoAoVivo(lista[lista.length-1]);
  }).catch(function(){ /* falha de poll pontual — ignora, tenta de novo no próximo ciclo */ });
}

function atualizarPrecoAoVivo(ultimaVela){
  var anterior = SMC._precoAnterior;
  $('live-price').textContent = ultimaVela.close.toFixed(5);
  if (typeof anterior === 'number'){
    var variacao = ((ultimaVela.close - anterior) / anterior) * 100;
    var el = $('live-change');
    el.textContent = (variacao>=0?'+':'') + variacao.toFixed(2) + '%';
    el.className = variacao >= 0 ? 'up' : 'down';
  }
  SMC._precoAnterior = ultimaVela.close;
}

// ---------------------------------------------------------------------
// Desenho / troca de timeframe
// ---------------------------------------------------------------------
function redesenhar(){
  var list = aggregateCandles(SMC.candles, SMC.chartMinutes);
  SMC.chartCandles = list;
  if (SMC.series){
    try{
      SMC.series.setData(list);
    }catch(e){
      console.error('series.setData falhou:', e, list.slice(0,5));
    }
  }
  $('chart-candle-count').textContent = list.length + ' candles';
}

function setChartTimeframe(minutes){
  SMC.chartMinutes = minutes;
  chartStatus.classList.remove('hidden');
  chartStatus.textContent = 'Carregando M' + minutes + '…';

  var precisaMinutos = TARGET_CANDLES * minutes;
  var jaTemMinutos = SMC.candles.length;

  function finalizar(){
    redesenhar();
    chartStatus.classList.add('hidden');
    setTimeout(setZoom, 150);
  }

  if (jaTemMinutos >= precisaMinutos) {
    finalizar();
  } else {
    fetchHistoryQtd(precisaMinutos).then(function(list){
      if (list.length > SMC.candles.length) SMC.candles = sanitizarCandles(list);
      finalizar();
    }).catch(function(){
      finalizar(); // sem conexão agora — desenha com o que já tem
    });
  }
}

function trocarPar(novoSimbolo, labelPar){
  SMC.symbol = novoSimbolo;
  SMC.candles = [];
  SMC.chartCandles = [];
  SMC._precoAnterior = undefined;
  $('pair-label').textContent = labelPar;
  $('chart-pair-label').textContent = novoSimbolo;
  $('live-price').textContent = '--';
  $('live-change').textContent = '--';
  $('live-change').className = '';
  chartStatus.classList.remove('hidden');
  chartStatus.textContent = 'Carregando ' + labelPar + '…';

  fetchHistoryComFallback().then(function(list){
    if (!list.length){
      chartStatus.textContent = 'Sem dados da IQ Option pra ' + labelPar + '.';
      return;
    }
    SMC.candles = sanitizarCandles(list);
    setChartTimeframe(SMC.chartMinutes);
  }).catch(function(){
    chartStatus.textContent = 'Sem conexão com a IQ Option no momento.';
  });
}

// ---------------------------------------------------------------------
// Ligações de UI
// ---------------------------------------------------------------------
document.querySelectorAll('[data-tf]').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('[data-tf]').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    setChartTimeframe(parseInt(btn.dataset.tf, 10));
  });
});

$('pair-select').addEventListener('change', function(){
  var opt = this.options[this.selectedIndex];
  trocarPar(opt.value, opt.textContent.trim());
});

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
function boot(){
  initChart();
  fetchHistoryComFallback().then(function(list){
    if (!list.length){
      chartStatus.textContent = 'Sem dados da IQ Option no momento. Tenta recarregar a página.';
      return;
    }
    SMC.candles = sanitizarCandles(list);
    atualizarPrecoAoVivo(list[list.length-1]);
    setChartTimeframe(15);
    pollTimer = setInterval(pollIqOption, IQ_POLL_INTERVAL_MS);
  }).catch(function(){
    chartStatus.textContent = 'Sem conexão com a IQ Option no momento.';
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
