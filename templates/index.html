<style>
  :root{
    --bg:#0b0e14;
    --panel:#0f131c;
    --panel2:#131722;
    --border:#1c2030;
    --text:#d1d4dc;

    --muted2:#9aa0ad;
    --cyan:#00d2ff;
    --green:#26a69a;
    --red:#ef5350;
    --yellow:#facc15;
    --purple:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:ui-monospace,'JetBrains Mono',Menlo,monospace;-webkit-tap-highlight-color:transparent}
  body{padding:10px;padding-bottom:40px;max-width:720px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}

  /* ---- logo ---- */
  #logo-card{border-color:rgba(0,210,255,0.35);text-align:center;padding:22px 12px}
  #logo-card .cube{width:56px;height:56px;margin:0 auto 8px;color:var(--cyan);filter:drop-shadow(0 0 10px rgba(0,210,255,0.55))}
  #logo-card h1{font-size:22px;letter-spacing:.04em;color:var(--cyan);text-shadow:0 0 14px rgba(0,210,255,0.45)}
  #logo-card p{font-size:11px;color:var(--yellow);letter-spacing:.08em;margin-top:2px}

  /* ---- price row ---- */
  #price-card{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  #price-card .pair{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fff}
  #price-card .pair .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  #price-info{display:flex;gap:14px;font-size:11px;color:var(--muted2);align-items:center}
  #live-price{font-size:13px;font-weight:700;color:#fff}
  #live-change.up{color:var(--green)} #live-change.down{color:var(--red)}
  #logout-link{color:var(--muted2);font-size:10px;text-decoration:none;border:1px solid var(--border);padding:5px 9px;border-radius:7px}

  /* ---- controls ---- */
  #controls-card{display:flex;flex-direction:column;gap:8px}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--muted2);cursor:pointer;letter-spacing:.02em}
  .btn.active{background:var(--cyan);color:#04121a;border-color:var(--cyan)}
  .btn.toggle.on{background:rgba(38,166,154,0.15);color:var(--green);border-color:var(--green)}
  .btn.toggle.off{background:transparent;color:var(--muted);border-color:var(--border)}

  /* ---- crono (relógio de contagem regressiva) ---- */
  .crono-box{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:2px solid var(--border);background:var(--panel2)}
  .crono-box .crono-lab{font-size:9px;color:var(--muted2)}
  .crono-box .crono-val{font-size:12px;font-weight:700;color:#fff}

  /* ---- F12 / botão TELA CHEIA ---- */
  body.app-fullscreen{ max-width:none; }
  body.app-fullscreen #chart-container{ height:60vh; }

  /* ---- chart ---- */
  #chart-card{padding:0;overflow:hidden}
  #chart-toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);font-size:10px;color:var(--muted2)}
  #chart-container{width:100%;height:420px;position:relative}
  #chart-status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;background:rgba(11,14,20,0.85);z-index:5}
  #chart-status.hidden{display:none}

  #modules-root{display:flex;flex-direction:column;gap:10px}

  #footer{text-align:center;font-size:9px;color:#3a4256;line-height:1.6;margin-top:14px;padding:0 10px}
</style>

  IQ OPTION · lightweight-charts 4.1.3 · dados ao vivo via app.py

<script>
// =====================================================================
// SMC BLACKBOX — gráfico base, construído do zero.
// Sem nenhum indicador (Fibo/Elliott/SMC/ZigZag/etc) — só o gráfico de
// velas funcionando direito. Indicadores entram depois, um de cada vez.
// =====================================================================

var $ = function(id){ return document.getElementById(id); };

var SMC = {
  symbol: 'EURUSD',
  chartMinutes: 15,
  candles: [],        // buffer de velas de 1min, sempre em ordem crescente
  chartCandles: [],   // velas já agregadas pro TF atual (o que está no gráfico)
  chart: null,
  series: null,
};

var TARGET_CANDLES = 100; // meta de velas visíveis em qualquer TF
var BASE_1M_BUFFER_MAX = 32000; // ~530h — cabe 500 velas até no H1
var IQ_POLL_INTERVAL_MS = 1000;

var chartContainer = $('chart-container');
var chartStatus = $('chart-status');

// ---------------------------------------------------------------------
// Gráfico
// ---------------------------------------------------------------------
function formatarHoraBrasil(ts){
  return new Intl.DateTimeFormat('pt-BR', { timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit' }).format(new Date(ts*1000));
}

// cada tipo de ativo usa uma quantidade de casas decimais diferente na vida
// real (JPY sempre com menos casas que os outros pares de forex, cripto com
// só 2) — usar 5 casas fixas pra tudo confundia o cálculo automático da
// régua de preço do gráfico e ela sumia (sem números do lado direito).
function precisaoDoPar(symbol){
  var s = (symbol || '').toUpperCase();
  if (s.indexOf('JPY') !== -1) return { precision: 3, minMove: 0.001 };
  if (s.indexOf('BTC') !== -1 || s.indexOf('ETH') !== -1) return { precision: 2, minMove: 0.01 };
  return { precision: 5, minMove: 0.00001 };
}

function initChart(){
  SMC.chart = LightweightCharts.createChart(chartContainer, {
    width: chartContainer.clientWidth,
    height: chartContainer.clientHeight,
    layout: { background: { color:'transparent' }, textColor:'#d1d4dc' },
    grid: { vertLines:{color:'#151b26'}, horzLines:{color:'#151b26'} },
    rightPriceScale: { borderColor:'#1c2430' },
    timeScale: { borderColor:'#1c2430', timeVisible:true, secondsVisible:false, tickMarkFormatter: formatarHoraBrasil },
    localization: { timeFormatter: formatarHoraBrasil },
  });
  SMC.series = SMC.chart.addCandlestickSeries({
    upColor:'#26a69a', downColor:'#ef5350', borderVisible:false,
    wickUpColor:'#26a69a', wickDownColor:'#ef5350',
    priceFormat: precisaoDoPar(SMC.symbol),
  });
  new ResizeObserver(function(){
    if (chartContainer.clientWidth) SMC.chart.applyOptions({ width: chartContainer.clientWidth });
  }).observe(chartContainer);
}

// densidade de vela em pixels — meta de 50 velas visíveis quando tem dado
// suficiente pra isso. Se tiver MENOS de 50 velas carregadas nesse TF
// (comum logo após abrir o app ou trocar de TF maior), usar sempre "50
// slots" deixa um vazio enorme de um lado, porque scrollToRealTime()
// ancora as poucas velas reais só na ponta. Nesse caso, preenche a
// largura toda com o intervalo de TEMPO real das velas que existem.
function setZoom(){
  if (!SMC.chart) return;
  try{
    var ts = SMC.chart.timeScale();
    var containerWidth = chartContainer.clientWidth || 700;
    var barSpacing = containerWidth / 50;
    var total = SMC.chartCandles.length;
    if (total > 0 && total < 50) {
      var periodSec = SMC.chartMinutes * 60;
      var firstTime = SMC.chartCandles[0].time;
      var lastTime = SMC.chartCandles[total - 1].time;
      ts.setVisibleRange({ from: firstTime, to: lastTime + Math.round(periodSec * 1.5) });
    } else {
      ts.applyOptions({ barSpacing: barSpacing, rightOffset: 6 });
      ts.scrollToRealTime();
    }
  }catch(e){ console.warn('zoom erro', e); }
}

// ---------------------------------------------------------------------
// Dados: normalização, sanitização, agregação
// ---------------------------------------------------------------------
function normCandle(v){
  return { time: v.time, open: v.open, high: v.high, low: v.low, close: v.close, volume: v.volume||0 };
}

// ordena, remove duplicata e timestamp inválido — a lib do gráfico se
// recusa a desenhar (fica tudo em branco, sem erro visível) se receber
// tempo fora de ordem ou repetido.
function sanitizarCandles(list, apenasDesde){
  if (!list || !list.length) return [];
  var vistos = {};
  var limpo = [];
  for (var i=0;i<list.length;i++){
    var c = list[i];
    if (!c || typeof c.time !== 'number' || isNaN(c.time)) continue;
    if (vistos[c.time]) continue;
    vistos[c.time] = true;
    limpo.push(c);
  }
  limpo.sort(function(a,b){ return a.time - b.time; });
  return removerOutliersDePreco(limpo, apenasDesde);
}

// Além de duplicata/tempo inválido, protege contra vela(s) com preço MUITO
// fora do range das vizinhas — isso acontece às vezes na busca de histórico
// (não só no poll ao vivo) e distorce a escala vertical inteira do gráfico
// (fica tudo espremido numa linha, porque o eixo de preço estica pra caber
// esse ponto fora da curva). Compara cada vela com a VIZINHANÇA local (não
// com uma mediana global fixa) — isso se adapta sozinho à volatilidade normal
// de cada ativo (forex é bem mais parado que Bitcoin/Ethereum, por exemplo),
// então não corta movimento real de ativo volátil por engano.
//
// apenasDesde: índice a partir do qual checar (opcional). As velas ANTIGAS
// já foram checadas em ciclos anteriores e não mudam mais — reprocessar o
// buffer inteiro (que pode chegar a 32.000 velas numa sessão longa) TODO
// segundo no poll seria um desperdício gigante de processamento. Só a
// carga inicial de histórico faz o scan completo (apenasDesde omitido).
function removerOutliersDePreco(list, apenasDesde){
  if (list.length < 12) return list;
  var janela = 15;
  var inicioCheck = apenasDesde!=null ? Math.max(0, apenasDesde) : 0;
  return list.filter(function(c, i){
    if (i < inicioCheck) return true; // já validado num ciclo anterior, não checa de novo
    var ini = Math.max(0, i-janela), fim = Math.min(list.length, i+janela+1);
    var vizLow = Infinity, vizHigh = -Infinity;
    for (var j=ini; j<fim; j++){
      if (j===i) continue;
      if (list[j].low < vizLow) vizLow = list[j].low;
      if (list[j].high > vizHigh) vizHigh = list[j].high;
    }
    if (!isFinite(vizLow) || !isFinite(vizHigh) || vizHigh<=vizLow) return true;
    var faixaViz = vizHigh - vizLow;
    // a vela é outlier se o high/low dela fica MUITO além da faixa que as
    // vizinhas ocupam (mais de 4x pra fora de qualquer lado)
    var foraPorCima = c.high - vizHigh;
    var foraPorBaixo = vizLow - c.low;
    return foraPorCima < faixaViz*4 && foraPorBaixo < faixaViz*4;
  });
}

function aggregateCandles(candles1m, minutes){
  if (minutes <= 1) return candles1m;
  var periodSec = minutes * 60;
  var out = [], bucket = null, bucketStart = null;
  for (var i=0;i<candles1m.length;i++){
    var c = candles1m[i];
    var start = c.time - (c.time % periodSec);
    if (bucketStart !== start) {
      if (bucket) out.push(bucket);
      bucketStart = start;
      bucket = { time: start, open: c.open, high: c.high, low: c.low, close: c.close, volume: c.volume||0 };
    } else {
      bucket.high = Math.max(bucket.high, c.high);
      bucket.low = Math.min(bucket.low, c.low);
      bucket.close = c.close;
      bucket.volume = (bucket.volume||0) + (c.volume||0);
    }
  }
  if (bucket) out.push(bucket);
  return out;
}

// ---------------------------------------------------------------------
// Rede: busca de histórico + polling ao vivo
// ---------------------------------------------------------------------
function fetchHistoryQtd(qtd){
  var url = '/candles?ativo=' + encodeURIComponent(SMC.symbol) + '&qtd=' + qtd;
  return fetch(url).then(function(res){
    if (!res.ok) throw new Error('http ' + res.status);
    return res.json();
  }).then(function(lista){
    return lista.map(normCandle);
  });
}

function fetchHistoryComFallback(){
  var qtdAlvo = TARGET_CANDLES * (SMC.chartMinutes || 15);
  return fetchHistoryQtd(qtdAlvo).then(function(list){
    if (list && list.length) return list;
    return fetchHistoryQtd(300);
  }).catch(function(){
    return fetchHistoryQtd(300);
  });
}

var pollTimer = null;
// A vela "viva" (ainda em formação) às vezes vem com alta/baixa
// completamente fora da realidade num único ciclo de atualização — um
// soluço momentâneo da IQ Option ao reportar a vela incompleta. Isso cria
// um "pavio fantasma" gigante que estica e volta ao normal sozinho no
// próximo ciclo. Rejeita atualizações assim: compara o candidato com a
// amplitude típica das últimas velas e ignora se vier absurdamente maior.
function pareceGlitch(candidato, buf){
  if (buf.length < 10) return false; // pouco histórico pra comparar, deixa passar
  var amplitudes = [];
  for (var i=buf.length-15;i<buf.length;i++){
    if (!buf[i]) continue;
    amplitudes.push(buf[i].high - buf[i].low);
  }
  if (!amplitudes.length) return false;
  // mediana em vez de média — se já entrou algum outlier antes por engano,
  // a média fica contaminada (permitindo o próximo outlier mais fácil); a
  // mediana resiste bem melhor a isso
  amplitudes.sort(function(a,b){ return a-b; });
  var amplitudeMediana = amplitudes[Math.floor(amplitudes.length/2)];
  if (amplitudeMediana <= 0) return false;
  var amplitudeCandidato = candidato.high - candidato.low;
  // mais de 4x a amplitude típica recente = quase certo que é ruído, não
  // movimento real (forex normal não pula assim de um minuto pro outro)
  return amplitudeCandidato > amplitudeMediana * 4;
}

function pollIqOption(){
  var simboloDoPoll = SMC.symbol;
  var geracaoDoPoll = SMC.geracaoPar;
  fetchHistoryQtd(100).then(function(lista){
    // se trocou de par enquanto essa busca estava no ar, descarta — senão
    // mistura vela de um ativo com o buffer de outro
    if (geracaoDoPoll !== SMC.geracaoPar || simboloDoPoll !== SMC.symbol) return;
    if (!lista.length) return;
    var buf = SMC.candles.slice();
    var byTime = {};
    for (var i=0;i<buf.length;i++) byTime[buf[i].time] = true;
    var novas = false;
    for (var j=0;j<lista.length;j++){
      var c = lista[j];
      if (pareceGlitch(c, buf)) continue; // ignora esse ciclo, tenta de novo no próximo poll
      if (!byTime[c.time]) { buf.push(c); novas = true; }
      else {
        // vela do minuto atual, ainda "viva" — atualiza em vez de duplicar
        for (var k=buf.length-1;k>=0 && k>buf.length-5;k--){
          if (buf[k].time === c.time) { buf[k] = c; break; }
        }
      }
    }
    if (novas) {
      // só precisa validar a "cauda" (últimas ~30) — o resto do buffer já
      // foi validado em ciclos anteriores e não muda mais. Evita reprocessar
      // um buffer que pode ter dezenas de milhares de velas TODO segundo.
      buf = sanitizarCandles(buf, Math.max(0, buf.length - 30));
      if (buf.length > BASE_1M_BUFFER_MAX) buf.splice(0, buf.length - BASE_1M_BUFFER_MAX);
    }
    SMC.candles = buf;
    redesenhar(true);
    if (lista.length) atualizarPrecoAoVivo(lista[lista.length-1]);
  }).catch(function(){ /* falha de poll pontual — ignora, tenta de novo no próximo ciclo */ });
}

function atualizarPrecoAoVivo(ultimaVela){
  var anterior = SMC._precoAnterior;
  $('live-price').textContent = ultimaVela.close.toFixed(precisaoDoPar(SMC.symbol).precision);
  if (typeof anterior === 'number'){
    var variacao = ((ultimaVela.close - anterior) / anterior) * 100;
    var el = $('live-change');
    el.textContent = (variacao>=0?'+':'') + variacao.toFixed(2) + '%';
    el.className = variacao >= 0 ? 'up' : 'down';
  }
  SMC._precoAnterior = ultimaVela.close;
}

// ---------------------------------------------------------------------
// Desenho / troca de timeframe
// ---------------------------------------------------------------------
// SEGUNDA CAMADA de proteção contra pavio fantasma — essa aqui atua DEPOIS
// da agregação (M5/M15/M30), porque um valor ruim escondido em só UMA das
// velas de 1min que formam o bucket agregado consegue esticar o bucket
// inteiro, mesmo que o filtro do poll (pareceGlitch) já tenha barrado esse
// valor ruim como vela "solta". Em vez de rejeitar a vela (não dá — ela
// ocupa uma posição de tempo fixa no gráfico), CLAMPA o pavio: limita o
// high/low dela pra não passar muito da faixa das vizinhas.
function clamparUltimaVela(list){
  if (!list.length) return;
  var i = list.length - 1;
  var c = list[i];

  // CAMADA 1 — quadro-a-quadro: compara com o valor que essa MESMA vela
  // (mesmo "time") tinha no ciclo de poll anterior. É a referência mais
  // confiável que existe, porque não depende de nenhuma janela/vizinhança
  // que possa estar contaminada por um glitch anterior. Um salto de mais
  // de 1% em 1 segundo é sempre implausível, pra qualquer ativo (nem
  // cripto pula assim tick a tick em condição normal).
  var quadroAnterior = SMC.chartCandles && SMC.chartCandles.length
    ? SMC.chartCandles[SMC.chartCandles.length-1] : null;
  if (quadroAnterior && quadroAnterior.time === c.time && quadroAnterior.close > 0){
    var ref = quadroAnterior.close;
    var limAltoQ = ref * 1.01, limBaixoQ = ref * 0.99;
    var clampQ = function(v){ return Math.min(limAltoQ, Math.max(limBaixoQ, v)); };
    c.open = clampQ(c.open);
    c.close = clampQ(c.close);
    c.high = clampQ(c.high);
    c.low = clampQ(c.low);
    c.high = Math.max(c.high, c.open, c.close);
    c.low = Math.min(c.low, c.open, c.close);
  }

  // CAMADA 2 — vizinhança: pega o caso de vela NOVA (ainda não tem "quadro
  // anterior" pra comparar, então a camada 1 não se aplica).
  if (list.length < 12) return;
  var ini = Math.max(0, i-15), fim = i;
  var vizLow = Infinity, vizHigh = -Infinity;
  for (var j=ini; j<fim; j++){
    if (list[j].low < vizLow) vizLow = list[j].low;
    if (list[j].high > vizHigh) vizHigh = list[j].high;
  }
  if (!isFinite(vizLow) || !isFinite(vizHigh) || vizHigh<=vizLow) return;
  var faixaViz = vizHigh - vizLow;
  var limiteAlto = vizHigh + faixaViz*2;
  var limiteBaixo = vizLow - faixaViz*2;
  // se o corpo (open/close) já está fora da faixa seguro, não é só o pavio
  // que veio errado — a vela inteira veio errada. Clampa TUDO (open, high,
  // low, close), sem preservar nada, senão um close/open corrompido escapa
  // por baixo do radar.
  function clamp(v){ return Math.min(limiteAlto, Math.max(limiteBaixo, v)); }
  c.open = clamp(c.open);
  c.close = clamp(c.close);
  c.high = clamp(c.high);
  c.low = clamp(c.low);
  // garante consistência interna (high sempre >= max(open,close), low sempre <= min(open,close))
  c.high = Math.max(c.high, c.open, c.close);
  c.low = Math.min(c.low, c.open, c.close);
}

function redesenhar(leve){
  var list = aggregateCandles(SMC.candles, SMC.chartMinutes);
  // sempre mostra só as últimas TARGET_CANDLES, mesmo que o buffer bruto
  // tenha mais dado guardado (acumulado de quando você visitou um TF maior
  // antes) — senão a quantidade de vela varia dependendo de qual TF você
  // passou por último, em vez de ser sempre a mesma meta em qualquer TF.
  if (list.length > TARGET_CANDLES) list = list.slice(list.length - TARGET_CANDLES);
  clamparUltimaVela(list);

  // no poll (a cada 1s), na grande maioria das vezes só a ÚLTIMA vela mudou
  // (ainda em formação) — usar series.update() pra atualizar só ela, em vez
  // de series.setData() com a lista inteira, evita o "pisca"/some-e-volta
  // que a redesenha completa causa a cada segundo. Só cai pro redesenho
  // completo quando a ESTRUTURA da lista muda de verdade (entrou uma vela
  // nova, ou é a primeira vez, ou mudou de TF/par).
  var anterior = SMC.chartCandles;
  var podeAtualizarSoUltima = leve && SMC.series && anterior && anterior.length === list.length &&
    list.length > 0 && (list.length < 2 || anterior[list.length-2].time === list[list.length-2].time);

  SMC.chartCandles = list;

  if (SMC.series){
    try{
      if (podeAtualizarSoUltima){
        SMC.series.update(list[list.length-1]);
      } else {
        SMC.series.setData(list);
      }
    }catch(e){
      console.error('series.setData/update falhou:', e, list.slice(0,5));
    }
  }
  $('chart-candle-count').textContent = list.length + ' candles';
}

function setChartTimeframe(minutes){
  SMC.chartMinutes = minutes;
  chartStatus.classList.remove('hidden');
  chartStatus.textContent = 'Carregando M' + minutes + '…';

  var precisaMinutos = TARGET_CANDLES * minutes;
  var jaTemMinutos = SMC.candles.length;

  function finalizar(){
    redesenhar();
    chartStatus.classList.add('hidden');
    setTimeout(setZoom, 150);
  }

  if (jaTemMinutos >= precisaMinutos) {
    finalizar();
  } else {
    fetchHistoryQtd(precisaMinutos).then(function(list){
      if (list.length > SMC.candles.length) SMC.candles = sanitizarCandles(list);
      finalizar();
    }).catch(function(){
      finalizar(); // sem conexão agora — desenha com o que já tem
    });
  }
}

SMC.geracaoPar = 0;
function trocarPar(novoSimbolo, labelPar){
  var minhaGeracao = ++SMC.geracaoPar;
  SMC.symbol = novoSimbolo;
  SMC.candles = [];
  SMC.chartCandles = [];
  SMC._precoAnterior = undefined;
  if (SMC.series) SMC.series.applyOptions({ priceFormat: precisaoDoPar(novoSimbolo) });
  $('pair-label').textContent = labelPar;
  $('chart-pair-label').textContent = novoSimbolo;
  $('live-price').textContent = '--';
  $('live-change').textContent = '--';
  $('live-change').className = '';
  chartStatus.classList.remove('hidden');
  chartStatus.textContent = 'Carregando ' + labelPar + '…';
  if (SMC.series) SMC.series.setData([]);

  fetchHistoryComFallback().then(function(list){
    // se o usuário já trocou de par de novo enquanto essa busca estava no ar,
    // essa resposta é de uma troca ANTERIOR e não pode mais ser aplicada —
    // senão mistura dado de um par com o outro (preço errado, % absurda)
    if (minhaGeracao !== SMC.geracaoPar) { console.warn('trocarPar: resposta atrasada descartada pra', novoSimbolo); return; }
    if (!list.length){
      chartStatus.textContent = 'Sem dados da IQ Option pra ' + labelPar + '. Tenta outro ativo ou aguarda o mercado abrir.';
      console.warn('trocarPar: lista vazia pra', novoSimbolo);
      return;
    }
    SMC.candles = sanitizarCandles(list);
    if (!SMC.candles.length){
      chartStatus.textContent = 'Dado de ' + labelPar + ' veio inválido — tenta de novo em alguns segundos.';
      console.warn('trocarPar: tudo filtrado como outlier/duplicata pra', novoSimbolo, list.slice(0,5));
      return;
    }
    setChartTimeframe(SMC.chartMinutes);
    if (!pollTimer) pollTimer = setInterval(pollIqOption, IQ_POLL_INTERVAL_MS);
  }).catch(function(err){
    if (minhaGeracao !== SMC.geracaoPar) return;
    chartStatus.textContent = 'Sem conexão com a IQ Option no momento.';
    console.error('trocarPar falhou pra', novoSimbolo, err);
  });
}

// ---------------------------------------------------------------------
// Ligações de UI
// ---------------------------------------------------------------------
document.querySelectorAll('[data-tf]').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('[data-tf]').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    setChartTimeframe(parseInt(btn.dataset.tf, 10));
  });
});

$('pair-select').addEventListener('change', function(){
  var opt = this.options[this.selectedIndex];
  trocarPar(opt.value, opt.textContent.trim());
});

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
function boot(){
  initChart();
  fetchHistoryComFallback().then(function(list){
    if (!list.length){
      chartStatus.textContent = 'Sem dados da IQ Option no momento. Tenta recarregar a página.';
      return;
    }
    SMC.candles = sanitizarCandles(list);
    atualizarPrecoAoVivo(list[list.length-1]);
    setChartTimeframe(15);
    pollTimer = setInterval(pollIqOption, IQ_POLL_INTERVAL_MS);
  }).catch(function(){
    chartStatus.textContent = 'Sem conexão com a IQ Option no momento.';
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

// =====================================================================
// Relógio de contagem regressiva — mostra quanto falta pra fechar a vela
// em cada TF (1M/5M/15M/30M/1H), independente de qual TF está ativo no
// gráfico. Portado idêntico do arquivo antigo.
// =====================================================================
function tickCronometro(){
  document.querySelectorAll('.crono-box').forEach(function(box){
    var tf = parseInt(box.dataset.tfSec, 10);
    var nowSec = Math.floor(Date.now()/1000);
    var restante = tf - (nowSec % tf);
    var m = Math.floor(restante/60), s = restante%60;
    box.querySelector('.crono-val').textContent = m + ':' + (s<10?'0':'') + s;
  });
}
setInterval(tickCronometro, 1000);
tickCronometro();

// =====================================================================
// Tela cheia — o app inteiro entra em fullscreen (não só o gráfico), que
// ganha um pouco mais de altura pra aproveitar o espaço extra da tela.
// Portado idêntico do arquivo antigo.
// =====================================================================
function toggleFullscreen(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
  else document.exitFullscreen().catch(function(){});
}
function redimensionarChartParaContainer(){
  if (!SMC.chart || !chartContainer) return;
  if (chartContainer.clientWidth) SMC.chart.applyOptions({ width: chartContainer.clientWidth });
  if (chartContainer.clientHeight) SMC.chart.applyOptions({ height: chartContainer.clientHeight });
}
function updateFsBtn(){
  var btn = $('fullscreen-btn');
  var isFs = !!document.fullscreenElement;
  document.body.classList.toggle('app-fullscreen', isFs);
  if (btn) btn.textContent = isFs ? '⛶ SAIR TELA CHEIA' : '⛶ TELA';
  setTimeout(redimensionarChartParaContainer, 50);
}
$('fullscreen-btn').addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('keydown', function(e){
  if (e.key === 'F12') { e.preventDefault(); toggleFullscreen(); }
});
window.addEventListener('resize', function(){ if (document.fullscreenElement) redimensionarChartParaContainer(); });
window.addEventListener('orientationchange', function(){ setTimeout(redimensionarChartParaContainer, 150); });
</script>
